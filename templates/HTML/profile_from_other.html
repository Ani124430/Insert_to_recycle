<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Game Profile</title>
<link rel="stylesheet" href="../CSS/profile.css">
</head>
<body>
    <style>
        @font-face {
    font-family: 'Pixel';
    src: url('../Images/Minecraft.ttf') format('truetype');
    font-weight: 100 700;
    font-style: normal;}

    body {
        background-image: url(../Images/1000005692.png);
        margin: 0;
        font-family: 'Pixel';
        color: white;
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
    }
   .header {
    display: grid;
    grid-template-columns: 1.5fr 2fr 1fr;
    align-items: center;
    background: rgb(67, 43, 21);
    padding: 1rem 2rem;
}

.logo {
    font-size: 3.5rem;
    justify-self: start;
}

.nav {
    display: flex;
    justify-content: center;
    gap: 3rem;
    justify-self: center;
}

.nav a {
    text-decoration: none;
    color: white;
    font-size: 1.7rem;
}

.nav a:hover {
    color: #291707;
}

.user {
    display: flex;
    align-items: center;
    gap: 1rem;
    justify-self: end; 
}

.profile-pic {
    width: 3rem;
    height: 3rem;
    border-radius: 50%;
    background: url(../Images/1000005692.png) center/cover;
    border: 0.3rem solid rgb(43, 22, 4);
}

.plus-btn {
    font-size: 4rem;
    width: 3.7rem;
    padding-top:1rem ;
    padding-left: 0.5rem;
    padding-right: 0.5rem;
    height: 3.7rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10%;
    color: white;
    text-decoration: none;
}

.plus-btn:hover {
    background: #331e01;
}
    .profile-pic {
        width: 2.8rem;
        height: 2.8rem;
        border-radius: 50%;
        background: url(../Images/1000005692.png) center/cover;
        padding: 1rem;
        margin-left: 5rem;
        border: 0.5rem solid rgb(43, 22, 4);
    }

    .header p {
      padding-left: 35rem;
      border: none;
      font-family: 'Pixel';
      font-size: 4rem;
      margin: none;
    }
    .main {
        margin-top: 1.5rem;
    display: grid;
     grid-template-columns: 2fr 1fr;
    gap: 1.8rem;
    padding: 1.8rem; 
    min-height: 100vh;
     position: relative;
}
    .left {
        display: flex;
        flex-direction: column;
        background:  rgba(150, 123, 65, 0.572);
        padding: 1rem;
        border-radius: 1.2rem;
        gap: 2rem;
        margin-left: 2rem;
    }
    .card {
        background:  rgba(43, 22, 4, 0.378);
        padding: 2rem;
        border-radius: 1.2rem;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .card h2 {
        margin-top: 0;
        color: rgb(37, 18, 1);
        margin-bottom: 15px;
    }

   .project {
    display: flex;
    gap: 1.2rem;
    align-items: flex-start;
    background: rgba(67, 43, 21, 0.78);
    border-radius: 0.8rem;
    padding: 0.8rem;
}
    .project:hover {
       background: rgba(43, 22, 4, 0.701);
    }

    .project img {
        width: 7rem;
        height: 7rem;
        border-radius: 0.8rem;
        object-fit: cover;
        margin-left: 1rem ;
    }
    .project-info {
    flex: 1;          
    min-width: 0;     
    display: flex;
    flex-direction: column;
}
.project-info p,
.project-info h3 {
    word-break: break-word;
}

.project-info h3 {
    margin: 0;
     color: rgb(37, 18, 1);
    font-size: 2rem;
}
.project-info p {
    margin: 2px 0 0;
    font-size: 1.5rem;
    color: #cbd5e1;
}

.right {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-right: 2rem;
}

.banner {
    height: 10rem;
    background: url(../Images/1000005692.png) center/cover;
    border-radius: 1.5rem;
    position: relative;
}

.big-profile {
    width: 8rem;
    height: 8rem;
    border-radius: 50%;
    background: url(../Images/1000005692.png) center/cover;
    border: 0.5rem solid rgb(63, 39, 18);
    margin: 7rem auto 0 auto; 
    display: block;
}

.profile-info {
    text-align: center;
    margin-top: 1rem;
    border-radius:1rem ;
    background-color: rgba(150, 123, 65, 0.572);
    border: solid 1.5rem rgba(43, 22, 4, 0.286);
    height: 20rem;
    padding: 4rem;
}

.profile-info h3 {
    margin: 1rem 0 0.5rem;
}

.profile-info p {
    font-size: 2rem;
     color: rgba(43, 22, 4);
}
.t{
    margin-top: 0.5rem;
    margin-left: 2rem;
    margin-bottom: 0.5rem;
    font-size: 4rem;
    color: rgba(43, 22, 4);
}
.profile-info button{
    font-family: 'Pixel';
    border-radius: 0.5rem;
    background-color: rgba(67, 43, 21, 0.78);
    border: none;
    color: white;
    padding: 1rem;
    font-size: 2rem;
}
.cloud {
    position: absolute;
    top: 45%; 
    left: 50%;
    width: 25rem;
    height: 30rem;
    z-index: 10; 
    pointer-events: none; 
}


#profile{
    text-decoration: none;
    font-size: 2rem;
    position: absolute;
    left: 15rem;
    top: 1.5rem;
    color: #000000;
    background: rgb(97, 55, 4);
    border: solid #331e01 1rem;
    border-radius: 1rem;
    padding: 0.5rem;
}


#profile:hover{
    background-color: #331e01;
}


#back{
    text-decoration: none;
    font-size: 2rem;
    position: absolute;
    right: 2rem;
    top: 1.5rem;
    color: #000000;
    background: rgb(97, 55, 4);
    border: solid #331e01 1rem;
    border-radius: 1rem;
    padding: 0.5rem;
}


#back:hover{
    background-color: #331e01;
}
    </style>
<div>

   <div class="header">

    <div class="logo">Insert to recycle</div>

    <div class="nav">
        <a href="#">Menu</a>
        <a href="#">Leaderboard</a>
          <a href="#">Profile</a>
    </div>

    <div class="user">
        <div class="profile-pic"></div>
         <a href="newproject.html" class="plus-btn">+</a>
    </div>

</div>

    <div class="main">
        <img src="../Images/cloud1.png" class="cloud">
        <div class="leftt">
        <p class="t">The profile of Yanichka_banichka </p>
        <div class="left">
            <div class="card">
                <h2>Finished Projects</h2>
                <div class="project">
                    <img src="../Images/1000005692.png" alt="Project 1">
                    <div class="project-info" style="margin-right: 4rem;">
                        <h3>AI ideas</h3>
                        <p>Some ideass that AI gave you </p>
                    </div>
                    <img src="../Images/1000005692.png" alt="Project 1">
                    <div class="project-info">
                        <h3>score</h3>
                        <p>why you have that score </p>
                    </div>
                </div>
            </div>
    </div>
        </div>
        <div class="right">
            <div class="banner">
                <div class="big-profile"></div>
            </div>

            <div class="profile-info">

                <p class="username">Yanichka_banichka</p>
                <!--  <div>
                    <p>Badges</p>
                    <img>
                    <img>
                    <img>
                    <img>
                </div> -->
                <p style="font-size: 1.5rem;">Bio </p>
                <p id="level">Level 1</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
