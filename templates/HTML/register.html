{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'CSS/menu.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/navbar.css' %}">
    <style>
        .form-container { max-width: 400px; margin: 80px auto; padding: 2rem; }
        .form-container input { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
        .form-container button { width: 100%; padding: 0.75rem; cursor: pointer; }
        .error { color: red; margin-bottom: 1rem; }
    </style>
</head>
<body>
    {% include "HTML/navbar.html" %}
<div class="moda" id="modal">
    <div class="modal-c" >
    <div class="modal-conten">
         <a href="{% url 'index' %}" class="close-btn">×</a>
    <div id="registerForm">
        <h2>Register</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="email" name="email" placeholder="Email">
            <input type="password" name="password" placeholder="Password" required>
            <input type="password" name="password2" placeholder="Confirm Password" required>
            <button type="submit">REGISTER</button>
        </form>
       <a style="text-decoration: none; color: black; margin-top:1rem ;" href="{% url 'login' %}">Already have an account?</a>
    </div>
    </div>
    </div>
</div>
</body>
</html>
