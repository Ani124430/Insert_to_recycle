<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Game Profile</title>
<style>
    @font-face {
    font-family: 'Pixel';
    src: url('../Images/Minecraft.ttf') format('truetype');
    font-weight: 100 700;
    font-style: normal;}

    body {
        background-image: url(../Images/1000005692.png);
        margin: 0;
        font-family: 'Pixel';
        color: white;
        background-repeat: no-repeat;
    background-size: cover;
    height: 100%;
    }
    .header {
        display: flex;
        align-items: center;
         background: rgb(79, 42, 9);
        backdrop-filter: blur(10px);
        padding: 10px 0;
    }

    .profile-pic {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: url(../Images/1000005692.png) center/cover;
        padding: 1rem;
        margin-left: 5rem;
        border: 0.5rem solid rgb(43, 22, 4);
    }

    .header p {
      padding-left: 35rem;
      border: none;
      font-family: 'Pixel';
      font-size: 4rem;
      margin: none;
    }
    .main {
        margin-top: 1.5rem;
    display: flex;
    gap: 20px;
    padding: 20px; 
    min-height: 100%;
    align-items: flex-start;
}
    .left {
        flex: 2;
        display: flex;
        flex-direction: column;
        gap: 20px;
        background: rgba(43, 22, 4, 0.44);
        padding: 1rem;
        border-radius: 15px;
        height: 35rem;
    }

    .card {
        background: rgba(43, 22, 4, 0.605);
        padding: 20px;
        border-radius: 15px;
        height: 80rem;
        box-shadow: 0 10px 20px rgba(0,0,0,0.3);
    }

    .card h2 {
        margin-top: 0;
        color: rgb(37, 18, 1);
        margin-bottom: 15px;
    }

    .project {
        display: flex;
        gap: 15px;
        align-items: center;
        background: rgb(79, 42, 9);
        height: 10rem;
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 10px;
        transition: 0.3s;
    }

    .project:hover {
       background: rgb(43, 22, 4);
    }

    .project img {
        width: 7rem;
        height: 7rem;
        border-radius: 10px;
        object-fit: cover;
        margin-left: 1rem ;
    }
    .project-info {
    display: flex;
    flex-direction: column;
}

.project-info h3 {
    margin: 0;
     color: rgb(37, 18, 1);
    font-size: 16px;
}
.project-info p {
    margin: 2px 0 0;
    font-size: 13px;
    color: #cbd5e1;
}

.right {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.banner {
    height: 150px;
    background: url(../Images/1000005692.png) center/cover;
    border-radius: 15px;
    position: relative;
}

.big-profile {
    width: 8rem;
    height: 8rem;
    border-radius: 50%;
    background: url(../Images/1000005692.png) center/cover;
    border: 4px solid rgb(79, 42, 9);
    margin: 80px auto 0 auto; 
    display: block;
}

.profile-info {
    text-align: center;
    margin-top: 1rem;
    border-radius:15px ;
    background: rgba(43, 22, 4, 0.44);
    height: 20rem;
}

.profile-info h3 {
    margin: 10px 0 5px;
}

.profile-info p {
    color: #94a3b8;
    font-size: 14px;
}
</style>
</head>
<body>

<div>

    <div class="header">
        <div class="profile-pic"></div>
          <p>Insert to recycle</p>
    </div>

    <div class="main">
        <div class="left">

            <div class="card">
                <h2>Finished Projects</h2>
                <div class="project">
                    <img src="/templates/Images/1000005692.png" alt="Project 1">
                    <div class="project-info">
                        <h3>Game UI</h3>
                        <p>Пълна потребителска интерфейс система</p>
                    </div>
                </div>
            </div>
            <div class="card">
                <h2>Unfinished Projects</h2>
                <div class="project">
                    <img src="/templates/Images/1000005692.png" alt="Project 3">
                    <div class="project-info">
                        <h3>Multiplayer Mode</h3>
                        <p>Създаване на мултиплейър система</p>
                    </div>
                </div>
            </div>

        </div>
        <div class="right">
            <div class="banner">
                <div class="big-profile"></div>
            </div>

            <div class="profile-info">
                <p id="level">Level 1</p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
