{% load static %}
<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'CSS/menu.css' %}">
    <link rel="stylesheet" href="{% static 'CSS/navbar.css' %}">
    <style>
        .form-container { max-width: 400px; margin: 80px auto; padding: 2rem; }
        .form-container input { display: block; width: 100%; margin-bottom: 1rem; padding: 0.5rem; }
        .form-container button { width: 100%; padding: 0.75rem; cursor: pointer; }
        .error { color: red; margin-bottom: 1rem; }
    </style>
</head>
<body>
    {% include "HTML/navbar.html" %}
    <div class="form-container">
        <h2>Login</h2>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">LOGIN</button>
        </form>
        <p>Don't have an account? <a href="{% url 'register' %}">Register</a></p>
    </div>
</body>
</html>
